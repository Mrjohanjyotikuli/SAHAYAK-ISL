services:
  - type: web
    name: sahayak-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SAHAYAK_FRONTEND_ORIGIN
        value: "*"
